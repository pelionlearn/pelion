steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['compose', '-f', 'docker-compose.yml', 'build']
    
images:
  - 'us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-frontend:latest'
  - 'us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-api:latest'
  - 'us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-celery:latest'

options:
  logging: CLOUD_LOGGING_ONLY
