name: test, build, and push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: install dependencies
        run: uv sync --frozen --dev

      - name: make test storage
        run: mkdir -p ./storage

      - name: run pytest
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: app
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: password
        run: uv run pytest

  build:
    name: build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image: us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-frontend:latest
          - name: api
            context: api
            dockerfile: api/Dockerfile
            image: us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-api:latest
          - name: celery
            context: coref
            dockerfile: coref/Dockerfile
            image: us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-celery:latest

    steps:
      - name: free space
        run: sudo rm -rf /usr/local/lib/android

      - name: checkout repo
        uses: actions/checkout@v4

      - name: check changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            changed:
              - '${{ matrix.context }}/**'

      - name: auth google cloud
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: auth google artifact registry
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: set up docker buildx
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: build images
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
