name: Docker Compose Build, Test, Push

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create env.test from GitHub secrets
        run: echo "${{ secrets.ENV_TEST }}" > .env.test

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Images with Buildx Bake
        run: |
          docker buildx bake \
            -f docker-compose.test.yml \
            --set *.cache-from=type=gha \
            --set *.cache-to=type=gha,mode=max

      - name: Run tests
        run: |
          docker compose -f docker-compose.test.yml up \
            --no-build \
            --abort-on-container-exit \
            --exit-code-from api

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push Images
        run: |
          docker compose -f docker-compose.test.yml config \
            | grep 'image:' \
            | awk '{print $2}' \
            | xargs -n1 docker push
