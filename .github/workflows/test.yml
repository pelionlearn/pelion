name: Docker Compose Build, Test, Push

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create env.test from GitHub secrets
        run: echo "${{ secrets.ENV_TEST }}" > .env.test

      - name: Build Containers
        run: docker compose -f docker-compose.test.yml build

      - name: Run Tests
        run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from api

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
