[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "fastapi>=0.139.0",
    "fastapi-users[oauth,sqlalchemy]>=15.0.5",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "liteparse>=2.12.0",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "resend>=2.39.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "auth",
    "db",
    "routers",
    "exceptions",
    "main",
]
omit = [
    "tests/*",
    "*/__init__.py",
]
