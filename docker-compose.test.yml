name: pelion-test
services:
  api:
    build: api/
    image: pelion-api:latest
    command: pytest -vv --cov
    ports:
      - "5000:5000"
    environment:
      STORAGE_LOCATION: /storage
    env_file:
      - ./.env.dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/migrations:/home/myuser/migrations
    tmpfs:
      - /storage

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    env_file:
      - ./.env.dev
    command: redis-server --requirepass ${REDIS_PASSWORD}

  postgres:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env.dev
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
