services:
  api:
    build: api/
    image: us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-api:latest
    profiles:
      - gcr
    command: pytest --cov # --cov-report=term-missing --cov-fail-under=50
    ports:
      - "5000:5000"
    env_file:
      - ./.env.test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./api/migrations:/home/myuser/migrations

  # celery:
  #   build: coref/
  #   environment:
  #     - MODEL_PATH=/app/model
  #   env_file:
  #     - ./.env.test

  redis:
    image: redis:latest
    profiles:
      - dependency
    ports:
      - "6379:6379"
    env_file:
      - ./.env.test
    command: redis-server --requirepass $$REDIS_PASSWORD

  # neo4j:
  #   image: neo4j:latest
  #   ports:
  #     - "6868:7474"
  #     - "6969:7687"
  #   env_file:
  #     - ./.env.test
  #   volumes:
  #     - neo4j:/etc/neo4j

  # chromadb:
  #   image: chromadb/chroma
  #   env_file:
  #     - ./.env.test
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - chromadb:/chroma/chroma
  #   environment:
  #     - IS_PERSISTENT=TRUE
  #     - PERSIST_DIRECTORY=/chroma/chroma

  postgres-test:
    image: postgres:17
    profiles:
      - dependency
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env.test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  neo4j:
  chromadb:
