services:
  api-test:
    build: api/
    command: pytest -vv --cov
    ports:
      - "5000:5000"
    env_file:
      - ./.env.test
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./api/migrations:/home/myuser/migrations
    tmpfs:
      - /storage

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    env_file:
      - ./.env.test
    command: redis-server --requirepass ${REDIS_PASSWORD}

  postgres-test:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env.test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  neo4j:
  chromadb:
