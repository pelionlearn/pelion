services:
  pelionllm-backend:
    build: backend/
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    depends_on:
      pelionllm-neo4j:
        condition: service_started
      pelionllm-chromadb:
        condition: service_started

  pelionllm-neo4j:
    image: neo4j:2026.05.0
    env_file:
     - backend/.env
    ports:
      - "6868:7474"
      - "6969:7687"
    volumes:
      - neo4j:/etc/neo4j

  pelionllm-frontend:
    build: frontend/
    ports:
      - "80:5173"
    depends_on: [pelionllm-backend]

  pelionllm-chromadb:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chromadb:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma

  pelionllm-postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j:
  chromadb:
  postgres_data: