services:
  pelionllm-backend:
    build: backend/
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    depends_on: [chromadb]

  pelionllm-frontend:
    build: frontend/
    ports:
      - "80:5173"
    depends_on: [pelionllm-backend]

  chromadb:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chromadb:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  chromadb:
  postgres_data: