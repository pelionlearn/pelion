services:
  frontend:
    build: frontend/
    image: us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-frontend:latest
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:8080"
    depends_on: [api]
    restart: unless-stopped

  api:
    build: api/
    image: us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-api:latest
    ports:
      - "5000:5000"
    environment:
      STORAGE_LOCATION: /storage # its probably best if you dont touch this
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api/migrations:/home/myuser/migrations
      - file_storage:/storage
    restart: unless-stopped

  # celery:
  #   build: coref/
  #   image: us-central1-docker.pkg.dev/pelion-503219/docker-repo/pelion-celery:latest
  #   environment:
  #     - MODEL_PATH=/app/model
  #   env_file:
  #     - ./.env
  #   restart: unless-stopped

  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    env_file:
      - ./.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

  # neo4j:
  #   image: neo4j:2026.05.0
  #   ports:
  #     - "6868:7474"
  #     - "6969:7687"
  #   env_file:
  #     - ./.env
  #   volumes:
  #     - neo4j:/etc/neo4j
  #   restart: unless-stopped

  postgres:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: postgres
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  # neo4j:
  postgres_data:
  file_storage:
